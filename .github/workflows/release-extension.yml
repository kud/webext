name: Release extension

# Reusable: builds, signs and uploads the listed AMO version, attaches the
# artefacts to the GitHub release, then applies the AMO listing. The version is
# the caller's business (git lzv, a repo script); nothing is bumped here.
#
# Two ways in, decided by the caller's event:
# - workflow_dispatch (preferred): run on main with `version` set to the
#   version already committed in the manifest. It refuses another branch, a
#   mismatched version or a tag on another commit, signs, and only then tags
#   the commit with the workflow's own token (unless that tag already points
#   at it), so a failed upload leaves nothing behind.
# - a pushed `<tag-prefix>*` tag (legacy, kept for callers not yet moved): the
#   tag is already there, so nothing is tagged.
#
# Secrets come from the caller via `secrets: inherit`. WEB_EXT_API_KEY and
# WEB_EXT_API_SECRET are used when present, MOZILLA_ADDONS_JWT_ISSUER and
# MOZILLA_ADDONS_JWT_SECRET otherwise. The caller grants `contents: write`.

on:
  workflow_call:
    inputs:
      root:
        description: "Extension directory, relative to the repository root"
        type: string
        default: "."
      node-version:
        type: string
        default: "lts/*"
      mode:
        description: "auto, wxt or web-ext. auto picks wxt when wxt is a dependency"
        type: string
        default: "auto"
      source-dir:
        description: "web-ext mode only: directory to sign, relative to root"
        type: string
        default: "."
      ignore-files:
        description: "web-ext mode only: space-separated globs left out of the package"
        type: string
        default: ""
      amo-metadata:
        description: "Optional AMO metadata JSON (release notes), relative to root"
        type: string
        default: ""
      listing:
        description: "Apply <root>/amo after signing, when <root>/amo/listing.json exists"
        type: boolean
        default: true
      icon:
        description: "128x128 icon PNG for the listing, relative to the repository root"
        type: string
        default: ""
      version:
        description: "workflow_dispatch only, required there: the version to release, which must equal the manifest's"
        type: string
        default: ""
      tag-prefix:
        description: "Prefix of the release tag; the tag is <tag-prefix><version>"
        type: string
        default: "v"
    secrets:
      WEB_EXT_API_KEY:
        required: false
      WEB_EXT_API_SECRET:
        required: false
      MOZILLA_ADDONS_JWT_ISSUER:
        required: false
      MOZILLA_ADDONS_JWT_SECRET:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      guid: ${{ steps.guid.outputs.guid }}
      has-listing: ${{ steps.listing.outputs.present }}
    defaults:
      run:
        working-directory: ${{ inputs.root }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the trigger
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch)
              [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run the release from main, not $GITHUB_REF."; exit 1; }
              [ -n "$VERSION" ] || { echo "::error::Pass the version to release."; exit 1; }
              ;;
            push)
              case "$GITHUB_REF" in
                refs/tags/*) ;;
                *) echo "::error::A push releases only from a tag, not $GITHUB_REF."; exit 1 ;;
              esac
              ;;
            *) echo "::error::Unsupported trigger '$EVENT'."; exit 1 ;;
          esac

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          # An npm workspace keeps its lockfile at the repository root.
          cache-dependency-path: ${{ hashFiles(format('{0}/package-lock.json', inputs.root)) != '' && format('{0}/package-lock.json', inputs.root) || 'package-lock.json' }}

      - name: Detect the build mode
        id: mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "auto" ]; then
            MODE=$(node -e '
              const p = require("./package.json")
              const deps = { ...p.dependencies, ...p.devDependencies }
              process.stdout.write("wxt" in deps ? "wxt" : "web-ext")
            ')
          fi
          case "$MODE" in
            wxt | web-ext) ;;
            *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build and zip
        if: steps.mode.outputs.mode == 'wxt'
        run: npx wxt zip -b firefox

      - name: Read the add-on id
        id: guid
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SOURCE_DIR: ${{ inputs.source-dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$MODE" = "wxt" ]; then
            built=(.output/firefox-mv*/manifest.json)
            [ "${#built[@]}" -eq 1 ] || { echo "::error::expected one .output/firefox-mv*/manifest.json"; exit 1; }
            manifest="${built[0]}"
          else
            manifest="$SOURCE_DIR/manifest.json"
          fi
          GUID=$(node -e '
            const m = require(require("path").resolve(process.argv[1]))
            const s = m.browser_specific_settings ?? m.applications ?? {}
            process.stdout.write(s.gecko?.id ?? "")
          ' "$manifest")
          [ -n "$GUID" ] || { echo "::error::no gecko.id in $manifest"; exit 1; }
          echo "guid=$GUID" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Resolve the release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
          PREFIX: ${{ inputs.tag-prefix }}
          MANIFEST: ${{ steps.guid.outputs.manifest }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The signed manifest is the version AMO sees, so it is the one checked.
          manifest_version=$(node -e '
            process.stdout.write(require(require("path").resolve(process.argv[1])).version ?? "")
          ' "$MANIFEST")
          [ "$manifest_version" = "$VERSION" ] || { echo "::error::$MANIFEST is at '$manifest_version', not $VERSION. Commit the bump to main first."; exit 1; }
          tag="$PREFIX$VERSION"
          # The checkout is shallow and carries no tags: ask the remote. An
          # annotated tag lists its commit on the peeled ^{} line.
          refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          tagged=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ {print $1}')
          [ -n "$tagged" ] || tagged=$(printf '%s\n' "$refs" | awk 'NF {print $1; exit}')
          if [ -z "$tagged" ]; then
            echo "create=true" >> "$GITHUB_OUTPUT"
          elif [ "$tagged" = "$GITHUB_SHA" ]; then
            # A bump tool that tags as it pushes (git lzv) already made it.
            echo "$tag already points at $GITHUB_SHA; releasing it as is."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$tag points at $tagged, not the commit being released ($GITHUB_SHA). Bump the version first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Sign and upload the listed AMO version
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY || secrets.MOZILLA_ADDONS_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET || secrets.MOZILLA_ADDONS_JWT_SECRET }}
          MODE: ${{ steps.mode.outputs.mode }}
          SOURCE_DIR: ${{ inputs.source-dir }}
          IGNORE_FILES: ${{ inputs.ignore-files }}
          AMO_METADATA: ${{ inputs.amo-metadata }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          args=(sign --channel listed --artifacts-dir web-ext-artifacts)
          if [ "$MODE" = "wxt" ]; then
            sources=(.output/*-sources.zip)
            [ "${#sources[@]}" -eq 1 ] || { echo "::error::expected one sources zip in .output"; exit 1; }
            built=(.output/firefox-mv*/)
            [ "${#built[@]}" -eq 1 ] || { echo "::error::expected one .output/firefox-mv* build"; exit 1; }
            args+=(--source-dir "${built[0]}" --upload-source-code "${sources[0]}")
          else
            args+=(--source-dir "$SOURCE_DIR")
            set -f
            for pattern in $IGNORE_FILES; do args+=(--ignore-files "$pattern"); done
            set +f
          fi
          [ -n "$AMO_METADATA" ] && args+=(--amo-metadata "$AMO_METADATA")
          npx -y web-ext "${args[@]}"

      # After the upload, not before: a failed sign leaves no tag to block the re-run.
      - name: Tag the released commit
        if: steps.tag.outputs.create == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Attach artefacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ inputs.root }}/web-ext-artifacts/*.xpi
            ${{ inputs.root }}/.output/*.zip

      - name: Look for an AMO listing
        id: listing
        run: |
          if [ -f amo/listing.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  amo-listing:
    needs: release
    if: ${{ inputs.listing && needs.release.outputs.has-listing == 'true' }}
    permissions:
      contents: write
    uses: kud/webext/.github/workflows/amo-listing.yml@main
    with:
      root: ${{ inputs.root }}
      apply: true
      guid: ${{ needs.release.outputs.guid }}
      icon: ${{ inputs.icon }}
      node-version: ${{ inputs.node-version }}
    secrets: inherit
