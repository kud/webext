name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # --provenance is the point of publishing via OIDC rather than a token: it
      # links the tarball back to the exact commit and workflow run that built
      # it, and shows as a verified-build badge on npm. Without it the job does
      # the OIDC dance and collects none of the benefit.
      - run: npm publish --provenance --access public
